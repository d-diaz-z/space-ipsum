<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Ipsum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <main>
        <header>
            <h1>✦ Space Ipsum</h1>
            <p class="tagline">AI-generated placeholder text from the cosmos</p>
        </header>

        <section class="controls">
            <label for="paragraphs">Number of paragraphs</label>
            <div class="input-row">
                <input 
                    type="number" 
                    id="paragraphs" 
                    min="1" 
                    max="10" 
                    value="3"
                />
                <button id="generate">Generate</button>
                <button id="copy" disabled>Copy</button>
            </div>
        </section>

        <section class="output">
            <div id="loading" class="hidden">
                <p id="loading-text">Scanning the cosmos...</p>
            </div>
            <div id="result"></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
